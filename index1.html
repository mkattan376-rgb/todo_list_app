<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="card">
        <h1>To Do List</h1>
        <div class="ribbon"> Articles</div>
        <div class="card-title">My Task List</div>
        <div class="checkbox-group">
            <label class="custom-checkbox">
                <input type="checkbox">
                <span class="task-text">finish the challenge HTML,CSS</span>
                <span class="checkmark"></span>
            </label>
            <label class="custom-checkbox">
                <input type="checkbox">
                <span class="task-text">study for the university</span>
                <span class="checkmark"></span>
            </label>
            <label class="custom-checkbox">
                <input type="checkbox">
                <span class="task-text">meeting with Shaghoof</span>
                <span class="checkmark"></span>
            </label>
        </div>
    </div>
</body>
</html>
